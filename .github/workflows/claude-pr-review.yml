          def effective_chunks(transcript, review):
            # The runner writes one bound manifest header followed by exactly one
            # two-line record per finalized chunk. Parse every byte, never search past
            # malformed framing or collapse duplicate IDs into a dictionary.
            keys = ("protocol repository pull_request base_ref base_sha head_sha "
                "merge_tree_sha workflow_sha256 exact_diff_sha256 "
                "review_representation_sha256 chunk_manifest_sha256 "
                "compaction_manifest_sha256 compacted_rows chunk_count").split()

            def unique_object(pairs):
              result = {}
              for key, value in pairs:
                if key in result:
                  raise ValueError("adjudication transcript duplicate JSON key")
                result[key] = value
              return result

            lines = transcript.decode("utf-8").split("\n")
            header = json.loads(lines[0], object_pairs_hook=unique_object)
            if "primary_fingerprints" in review:
              keys.append("primary_fingerprints")
            if encoded(header) != encoded({key: review[key] for key in keys}):
              raise ValueError("adjudication transcript header binding")
            if lines[-1] != "" or len(lines) != 2 * review["chunk_count"] + 2:
              raise ValueError("adjudication transcript framing or coverage")
            effective = {}
            for offset in range(1, len(lines) - 1, 2):
              frame = re.fullmatch(r"C=([0-9]{4}) T=[0-9]+", lines[offset])
              if not frame:
                raise ValueError("adjudication transcript framing or coverage")
              index = int(frame[1])
              if index in effective or index != len(effective) + 1:
                raise ValueError("adjudication transcript identity or coverage")
              body = json.loads(lines[offset + 1], object_pairs_hook=unique_object)
              if (not isinstance(body, dict) or type(body.get("chunk_index")) is not int
                  or body["chunk_index"] != index):
                raise ValueError("adjudication transcript body identity")
              effective[index] = body
            return effective


          def attest(index, body, files):
            """A CONSISTENCY HASH, not an independent proof: it binds the transcript body and the context
              file list to the review job's own claim that the re-review was supported. Downstream can
              check the binding; it does not prove the support, which only the review job could judge."""
            return {"supported": True, "sha256": digest(encoded(
              {"chunk_index": index, "body": body, "files": files, "supported": True}))}


