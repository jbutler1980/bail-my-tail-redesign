              """
            # Closed literal profiles: the value says whether backslash escapes the
            # next character. Go raw strings and shell single quotes are literal.
            # YAML proof needs a parser outside this supported lexical contract.
            profiles = {
              "py": {"'": True, '"': True, "'''": True, '"""': True},
              "js": {"'": True, '"': True},
              "ts": {"'": True, '"': True},
              "go": {"'": True, '"': True, "`": False},
