            # schema and framing. At most one token per wire byte plus 10,000
            # tokens of service framing fits the 80,000-token input validator.
            if [ "$(wc -c < "$wire_request")" -gt 70000 ]; then
              record_failure_stage "model-request-bound"
              echo "OpenAI wire request exceeds the 70000-byte input bound." >&2
              return 1
            fi
            for attempt in 1 2; do
              if [ "$(( $(date +%s) + 975 ))" -ge "$REVIEW_DEADLINE_EPOCH" ]; then
                if [ "$non_authoritative_confirmation" != "1" ]; then
                  record_failure_stage "review-time-budget"
                fi
                echo "Review time budget exhausted before the next model call." >&2
                return 1
              fi
              request_started_ms="$(date +%s%3N)"
              # STRICTLY BEFORE the request on the next line. Nothing may be
              # inserted between these two statements.
              assert_kill_switch_on || return 1
              if ! status="$(curl --silent --show-error \
                --max-time 900 \
                https://api.openai.com/v1/responses \
                -H "Accept: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -H "content-type: application/json" \
                --data-binary "@$wire_request" \
                --dump-header "$headers" \
                --output "$raw_response" \
                --write-out '%{http_code}')"; then
                record_primary_fingerprint_request "$wire_request" "transport-error" || return 1
                echo "OpenAI transport failed; request was not retried." >&2
                return 1
              fi
              record_primary_fingerprint_request "$wire_request" "$status" || return 1
              request_finished_ms="$(date +%s%3N)"
              wall_ms=$((request_finished_ms - request_started_ms))
              if [ "$status" = "200" ]; then
                # Normalize only the completed final assistant message. Reasoning
                # items are never candidates for a verdict, and incomplete or
                # ambiguous output fails before the existing strict validators.
                if python3 - "$raw_response" "$response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              body = json.load(source)
          if body.get("object") != "response":
              raise SystemExit(3)
          if body.get("status") != "completed":
              raise SystemExit(2 if body.get("status") == "incomplete" else 3)
          output = body.get("output")
          if not isinstance(output, list):
              raise SystemExit(3)
          messages = []
          for item in output:
              if not isinstance(item, dict):
                  raise SystemExit(3)
              if item.get("type") == "message":
                  messages.append(item)
              elif item.get("type") == "reasoning":
                  if (item.get("status") not in (None, "completed")
                          or not isinstance(item.get("summary"), list)
                          or any(not isinstance(part, dict)
                                 or part.get("type") != "summary_text"
                                 or not isinstance(part.get("text"), str)
                                 for part in item["summary"])
                          or item.get("content") not in (None, [])):
                      raise SystemExit(3)
              else:
                  raise SystemExit(3)
          if len(messages) != 1:
              raise SystemExit(3)
          message = messages[0]
          if (message.get("role") != "assistant"
                  or message.get("status") != "completed"
                  or message.get("phase") != "final_answer"):
              raise SystemExit(3)
          content = message.get("content")
          if (not isinstance(content, list) or len(content) != 1
                  or content[0].get("type") != "output_text"
                  or not isinstance(content[0].get("text"), str)):
              raise SystemExit(3)
          usage = body.get("usage") or {}
          normalized = {
              "model": body.get("model"),
              "choices": [{"finish_reason": "stop", "message": {
                  "role": "assistant", "content": content[0]["text"]}}],
              "usage": {
                  "prompt_tokens": usage.get("input_tokens"),
                  "completion_tokens": usage.get("output_tokens"),
                  "completion_tokens_details": {
                      "reasoning_tokens": (usage.get("output_tokens_details") or {}).get("reasoning_tokens")},
                  "total_tokens": usage.get("total_tokens"),
              },
          }
          with open(sys.argv[2], "w", encoding="utf-8") as target:
              json.dump(normalized, target, separators=(",", ":"))
          PY
                then
                  token_counts="$(jq -r '
                    [(.usage.input_tokens? // 0),
                     (.usage.output_tokens? // 0),
                     (.usage.output_tokens_details.reasoning_tokens? // 0)]
                    | map(tostring) | join(" ")
                  ' "$raw_response")"
                  read -r input_tokens output_tokens reasoning_tokens <<< "$token_counts"
                  printf 'OpenAI call metrics: model=%s effort=%s input_tokens=%s output_tokens=%s reasoning_tokens=%s wall_ms=%s\n' \
                    "$MODEL" "$REASONING_EFFORT" "$input_tokens" "$output_tokens" \
                    "$reasoning_tokens" "$wall_ms" >&2
                  printf '%s\n' "$status"
                  return 0
                else
                  parser_status=$?
                  if [ "$parser_status" -eq 2 ]; then
                    if [ "$non_authoritative_confirmation" != "1" ]; then
                      record_failure_stage "model-output-incomplete"
                    fi
                    echo "OpenAI response exhausted its output budget without a completed verdict." >&2
                  else
                    if [ "$non_authoritative_confirmation" != "1" ]; then
                      record_failure_stage "model-response-shape"
                    fi
                    echo "OpenAI response lacked exactly one completed final assistant message." >&2
                  fi
                  return 1
                fi
              fi
              if [ "$status" = "401" ] || [ "$status" = "403" ] || [ "$status" = "404" ]; then
                record_failure_stage "model-access-denied" "http_status=${status}"
                cp -- "$raw_response" "$response"
                printf '%s\n' "$status"
                return 0
              fi
              if [ "$attempt" -eq 2 ]; then
                cp -- "$raw_response" "$response"
                printf '%s\n' "$status"
                return 0
              fi
              retry_after="$(awk '
                tolower($1) == "retry-after:" {
                  gsub("\\r", "", $2)
                  if ($2 ~ /^[0-9]+$/) value = $2
