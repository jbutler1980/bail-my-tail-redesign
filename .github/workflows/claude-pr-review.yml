            """A tree-backed body may publish only quotes already in the PR diff, or a 16 byte prefix + hash."""
            allowed = bundle["representation"] + disclosed_context(bundle, index)
            for fact in body.get("interface_facts", []):
              quote = fact.get("evidence")
              if not isinstance(quote, str) or not (quote in allowed or re.fullmatch(r".{16}~sha256:[0-9a-f]{16}", quote, re.S)):
                raise ValueError("tree-sourced evidence is published unredacted")


          def check_files(files):
            if (not isinstance(files, list) or not 0 < len(files) <= MAX_TREE_FILES
                or len({f.get("path") for f in files if isinstance(f, dict)}) != len(files)):
              raise ValueError("tree context file list")
            for f in files:
              if (not isinstance(f, dict) or set(f) != {"path", "tree", "blob", "sha256", "bytes"}
                  or path_refusal(f["path"]) or f["tree"] not in ("candidate", "base")
                  or not isinstance(f["blob"], str) or not re.fullmatch(r"[0-9a-f]{40}", f["blob"])
                  or not isinstance(f["sha256"], str) or not re.fullmatch(r"[0-9a-f]{64}", f["sha256"])
                  or type(f["bytes"]) is not int or not 0 < f["bytes"] <= MAX_TREE_FILE):
                raise ValueError("tree context file entry")


          def verify(response):
            review = response["review"]
            receipt = review["context_adjudication"]
            records = receipt["records"]
            uses = receipt.get("uses", [])
            if (type(review["chunk_count"]) is not int or not 1 <= review["chunk_count"] <= 72
                or not isinstance(records, list) or not isinstance(uses, list)
                or len(records) + len(uses) > review["chunk_count"]):
              raise ValueError("adjudication record shape")
            if review.get("context_rereviews") != len(records) + len(uses):
              raise ValueError("adjudication counter binding")
            if not records and not uses:
              if receipt["source_gzip_b64"] != "":
                raise ValueError("unexpected adjudication source")
            if records or uses:
              compressed = decoded(receipt["source_gzip_b64"], MAX_COMPRESSED)
              # Bound decompression before allocation, including JSON structural overhead.
              with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
                raw = stream.read(2 * MAX_SOURCE + 131073)
                if len(raw) > 2 * MAX_SOURCE + 131072 or stream.read(1):
                  raise ValueError("adjudication decompressed capacity")
              bundle = json.loads(raw)
              source_parts(bundle, review)
            compressed_transcript = decoded(response["review_transcript_gzip_b64"], MAX_COMPRESSED)
            with gzip.GzipFile(fileobj=io.BytesIO(compressed_transcript)) as stream:
              transcript = stream.read(80001)
            if len(transcript) > 80000 or digest(transcript) != review["review_transcript_sha256"]:
              raise ValueError("adjudication effective transcript binding")
            effective = effective_chunks(transcript, review)
            fp = review.get("primary_fingerprints", [])
            check_primary_fingerprints(fp, review)
            if fp:
              requests = review.get("primary_fingerprint_requests")
              if (not isinstance(requests, list) or not 1 <= len(requests) <= 128
                  or len(encoded(requests)) > 32768):
                raise ValueError("fingerprint request receipt missing or oversized")
              for request in requests:
                if (not isinstance(request, dict) or set(request) != {"chunk_index","chunk_nonce","wire_sha256","http_status"}
                    or type(request["chunk_index"]) is not int or not 1 <= request["chunk_index"] <= review["chunk_count"]
                    or not re.fullmatch(r"[0-9a-f]{32}", request["chunk_nonce"])
                    or not re.fullmatch(r"[0-9a-f]{64}", request["wire_sha256"])
                    or not re.fullmatch(r"(?:[1-5][0-9]{2}|transport-error)", request["http_status"])):
                  raise ValueError("fingerprint request receipt invalid")
              for index in fp[0]["affected_chunks"]:
                body = effective.get(index, {})
                if not any(r["chunk_index"] == index and r["chunk_nonce"] == body.get("chunk_nonce")
                    and r["http_status"] == "200" for r in requests):
                  raise ValueError("fingerprint request replay or substitution")
            seen = set()
            for use in uses:
              index = use.get("chunk_index") if isinstance(use, dict) else None
              if (type(index) is not int or index in seen or not 1 <= index <= review["chunk_count"]
                  or set(use) != {"chunk_index", "phase", "files", "refused", "bytes", "attestation"}
                  or use["phase"] != "security" or type(use["bytes"]) is not int or not 0 < use["bytes"] <= 16000
                  or not isinstance(use["refused"], list)):
                raise ValueError("adjudication duplicate identity")
              seen.add(index)
              check_files(use["files"])
              if use["attestation"] != attest(index, effective.get(index), use["files"]):
                raise ValueError("adjudication attestation")
              published_evidence(bundle, index, effective[index])
            for record in records:
              index = record["chunk_index"]
              if type(index) is not int or index in seen:
                raise ValueError("adjudication duplicate identity")
              seen.add(index)
              primary, secondary, tree = record["primary"], record["secondary"], record.get("tree")
              text, original = capsule(bundle, index, primary)
              if tree is not None:
                # Tree files are never published: only the runner, which read them, judged
                # support; here the metadata, the diff binding and the transcript are checked.
                if set(tree) != {"files"}:
                  raise ValueError("tree context record")
                check_files(tree["files"])
                if record.get("attestation") != attest(index, secondary, tree["files"]):
                  raise ValueError("adjudication attestation")
                published_evidence(bundle, index, secondary)
              elif record["context_sha256"] != record["diff_sha256"]:
                raise ValueError("adjudication context binding")
              if (primary["chunk_index"] != index or secondary["chunk_index"] != index
                  or digest(text.encode()) != record["diff_sha256"]
                  or (tree is None and not supported(
                    primary, secondary, text, original + disclosed_context(bundle, index) + record["initial_context"]))
                  or encoded(secondary) != encoded(effective.get(index))):
                raise ValueError("unsupported missing-context dismissal")


          if __name__ == "__main__":
              verify(json.loads(Path(sys.argv[1]).read_text()))
          PY
          # END PROTECTED CONTEXT ADJUDICATION HELPER
          jq -jr .review_transcript_gzip_b64 "$response_manifest" \
            | base64 -d > "$transcript_gzip"
          test "$(wc -c < "$transcript_gzip")" \
            = "$(jq -er .review_transcript_gzip_bytes "$response_manifest")"
          test "$(sha256sum "$transcript_gzip" | cut -d' ' -f1)" \
            = "$(jq -er .review_transcript_gzip_sha256 "$response_manifest")"
          gzip -cd "$transcript_gzip" | head -c 80001 > "$transcript"
          test "$(wc -c < "$transcript")" \
            = "$(jq -er .review.review_transcript_bytes "$response_manifest")"
          test "$(sha256sum "$transcript" | cut -d' ' -f1)" \
            = "$(jq -er .review.review_transcript_sha256 "$response_manifest")"
          jq -jr .interface_ledger "$response_manifest" > "$ledger"
          test "$(wc -c < "$ledger")" \
            = "$(jq -er .review.interface_ledger_bytes "$response_manifest")"
          test "$(sha256sum "$ledger" | cut -d' ' -f1)" \
            = "$(jq -er .review.interface_ledger_sha256 "$response_manifest")"
          test "$INJECTION_DETECTED" = "false"
          test "$STRUCTURED_VERDICT" = "pass"
          printf 'adversarial-review-outcome: %s\n' "$STRUCTURED_VERDICT" >&2
          {
            echo "reviewed-base-ref=$EXPECTED_BASE_REF"
            echo "reviewed-base-sha=$EXPECTED_BASE_SHA"
            echo "reviewed-chunk-count=$EXPECTED_CHUNK_COUNT"
            echo "reviewed-chunk-manifest-sha256=$EXPECTED_CHUNK_MANIFEST_SHA256"
            echo "reviewed-compaction-manifest-sha256=$EXPECTED_COMPACTION_MANIFEST_SHA256"
            echo "reviewed-diff-sha256=$EXPECTED_DIFF_SHA256"
            echo "reviewed-head-sha=$EXPECTED_HEAD_SHA"
            echo "reviewed-merge-tree-sha=$EXPECTED_MERGE_TREE_SHA"
            echo "reviewed-model=$EXPECTED_MODEL"
            echo "reviewed-representation-sha256=$EXPECTED_REPRESENTATION_SHA256"
            echo "reviewed-response-manifest-b64=$EXPECTED_RESPONSE_MANIFEST_B64"
            echo "reviewed-response-manifest-sha256=$EXPECTED_RESPONSE_MANIFEST_SHA256"
            echo "reviewed-workflow-sha256=$EXPECTED_WORKFLOW_SHA256"
            echo "verdict=$STRUCTURED_VERDICT"
          } >> "$GITHUB_OUTPUT"

      - name: Review diagnostics
        id: diagnostics
        if: always() && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          DIAGNOSTIC_PHASES: ${{ steps.source.outcome }} ${{ steps.chunks.outcome }} ${{ steps.claude.outcome }} ${{ steps.verdict.outcome }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, zlib
          code = zlib.decompress(base64.b64decode("", validate=True))
          if len(code) > 8192 or hashlib.sha256(code).hexdigest() != "7166e6c3aa3e97c79bbf4acb869ab29e1e1dba007786766bbbb4748468106f29": raise ValueError("diagnostic payload")
          exec(compile(code, "protected-review-diagnostics", "exec"))
          PY
      - name: Re-assert default-head liveness before reporting success
        env:
          # Both come from the source step, which already proved them: the
          # branch name passed `git check-ref-format --branch`, passed the
          # publication-alphabet gate, and was tied to the ref this workflow
          # executed from by the workflow_ref tripwire. Re-deriving either from
          # the event payload here would re-admit exactly the untrusted channel
          # the source step spent that proof to close.
          BASE_REF_ADMITTED_VIA: ${{ steps.source.outputs.base-ref-admitted-via }}
          DEFAULT_BRANCH: ${{ steps.source.outputs.default-branch }}
          EXPECTED_BASE_REF: ${{ steps.source.outputs.base-ref }}
          EXPECTED_BASE_SHA: ${{ steps.source.outputs.base-sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fail_final_liveness() {
            printf 'Adversarial review failed final liveness assertion: %s\n' \
              "$1" >&2
            exit 1
          }
          # The #210 encoder, verbatim in behaviour: every byte outside the
          # publication alphabet becomes %XX while the path-structural '/' is
          # preserved, so a release ref is never rewritten.
          url_encode_ref() {
            local raw="$1" out="" i char
            for (( i = 0; i < ${#raw}; i++ )); do
              char="${raw:i:1}"
              case "$char" in
                [A-Za-z0-9._/-]) out+="$char" ;;
                *) printf -v char '%%%02X' "'$char"; out+="$char" ;;
              esac
            done
            printf '%s' "$out"
          }
          # An UNRECOGNISED admission path is a failure, not a default. If the
          # source step ever stops recording which path admitted, the safe
          # reading is not "assume the unbound one".
          case "$BASE_REF_ADMITTED_VIA" in
            default-branch | configured-allowlist) ;;
            *)
              fail_final_liveness \
                "the source step recorded no admission path, so the correct end-of-job binding cannot be chosen; pr=${PR_NUMBER}"
              ;;
          esac
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]{1,512}$ ]] \
            || fail_final_liveness \
              "default branch is outside the publication alphabet; default_branch_bytes=${#DEFAULT_BRANCH} pr=${PR_NUMBER}"
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail_final_liveness \
              "workflow_sha is not a 40-hex object name; workflow_sha_bytes=${#EXPECTED_WORKFLOW_SHA} pr=${PR_NUMBER}"
          encoded_final_default_branch="$(url_encode_ref "$DEFAULT_BRANCH")"
          final_default_head="$(timeout --kill-after=5s 20s gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_final_default_branch}" \
            2>/dev/null --jq '.object.sha' || true)"
          [[ "$final_default_head" =~ ^[0-9a-f]{40}$ ]] \
            || fail_final_liveness \
              "the live default head did not resolve at the end of the required job; default_branch=${DEFAULT_BRANCH} pr=${PR_NUMBER}"
          case "$BASE_REF_ADMITTED_VIA" in
            default-branch)
              : # Ordinary default-branch movement does not change reviewer identity.
              ;;
            configured-allowlist)
              test "$EXPECTED_WORKFLOW_SHA" = "$final_default_head" \
                || fail_final_liveness \
                  "stale_reviewer_at_exit: the reviewer that produced this verdict is no longer canonical; workflow_sha=${EXPECTED_WORKFLOW_SHA} final_default_head=${final_default_head} default_branch=${DEFAULT_BRANCH} pr=${PR_NUMBER}"
              encoded_final_base_ref="$(url_encode_ref "$EXPECTED_BASE_REF")"
              final_reviewed_base_head="$(timeout --kill-after=5s 20s gh api \
                "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_final_base_ref}" \
                2>/dev/null --jq '.object.sha' || true)"
              test "$EXPECTED_BASE_SHA" = "$final_reviewed_base_head" \
                || fail_final_liveness \
                  "stale_allowlisted_base_at_exit: the reviewed allowlisted base advanced while this run was in flight; base_ref=${EXPECTED_BASE_REF} base_sha=${EXPECTED_BASE_SHA} final_base_head=${final_reviewed_base_head} pr=${PR_NUMBER}"
              ;;
          esac
          # One line, in the same shape as the outcome line, so an operator can
          # read off a passing run WHICH liveness contract it satisfied rather
          # than inferring it from the absence of a failure.
          printf 'final-default-head-liveness: ok admitted_via=%s default_branch=%s final_default_head=%s\n' \
            "$BASE_REF_ADMITTED_VIA" "$DEFAULT_BRANCH" "$final_default_head" >&2

  publish-review-evidence:
    name: publish-review-evidence
    needs: claude-review
    if: >-
      always() &&
      (
        (
          needs.claude-review.result == 'success' &&
          needs.claude-review.outputs.verdict == 'pass'
        ) ||
        (
          needs.claude-review.result == 'failure' &&
          needs.claude-review.outputs.verdict == 'fail' &&
          (
            needs.claude-review.outputs.failure-stage == 'merit' ||
            needs.claude-review.outputs.failure-stage == 'injection'
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PROFILE_RESPONSE_MODEL: gpt-6-luna
    steps:
      - name: Revalidate and publish non-authorizing review evidence
        env:
          # FAIL-LANE INPUTS. Diagnostic only; see the lane guard in the script.
          FAILURE_STAGE: ${{ needs.claude-review.outputs.failure-stage }}
          OBJECTION_B64: ${{ needs.claude-review.outputs.objection-b64 }}
          PUBLISHED_VERDICT: ${{ needs.claude-review.outputs.verdict }}
          EXPECTED_BASE_REF: ${{ needs.claude-review.outputs.reviewed-base-ref }}
          EXPECTED_BASE_SHA: ${{ needs.claude-review.outputs.reviewed-base-sha }}
          EXPECTED_CHUNK_COUNT: ${{ needs.claude-review.outputs.reviewed-chunk-count }}
          EXPECTED_CHUNK_MANIFEST_SHA256: ${{ needs.claude-review.outputs.reviewed-chunk-manifest-sha256 }}
          EXPECTED_COMPACTION_MANIFEST_SHA256: ${{ needs.claude-review.outputs.reviewed-compaction-manifest-sha256 }}
          EXPECTED_DIFF_SHA256: ${{ needs.claude-review.outputs.reviewed-diff-sha256 }}
          EXPECTED_HEAD_SHA: ${{ needs.claude-review.outputs.reviewed-head-sha }}
          EXPECTED_MERGE_TREE_SHA: ${{ needs.claude-review.outputs.reviewed-merge-tree-sha }}
          EXPECTED_MODEL: ${{ needs.claude-review.outputs.reviewed-model }}
          EXPECTED_REPRESENTATION_SHA256: ${{ needs.claude-review.outputs.reviewed-representation-sha256 }}
          EXPECTED_RESPONSE_MANIFEST_B64: ${{ needs.claude-review.outputs.reviewed-response-manifest-b64 }}
          EXPECTED_RESPONSE_MANIFEST_SHA256: ${{ needs.claude-review.outputs.reviewed-response-manifest-sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ needs.claude-review.outputs.reviewed-workflow-sha256 }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The repository default branch, used to tell the default-base path from
          # a configured-allowlist path when re-deriving the execution proof below.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # --- LANE DISCRIMINATION -------------------------------------------
          #
          # Two lanes reach this step and they publish different things:
          #
          #
          #           none-merge-authority field, and a FAIL comment cannot make
          #
          case "${PUBLISHED_VERDICT:-}" in
            pass) publish_verdict=PASS ;;
            fail) publish_verdict=FAIL ;;
            *)
              echo "Publisher reached with no usable verdict; publishing nothing." >&2
              exit 1
              ;;
          esac
          if [ "$publish_verdict" = "FAIL" ]; then
            case "${FAILURE_STAGE:-}" in
              merit|injection) ;;
              *)
                echo "Publisher reached with a non-substantive failure stage; publishing nothing." >&2
                exit 1
                ;;
            esac
          fi
          test "$EXPECTED_BASE_REF" = "$(git check-ref-format --branch "$EXPECTED_BASE_REF")"
          test "$(printf '%s' "$EXPECTED_BASE_REF" | wc -c)" -le 512
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MODEL" == "${PROFILE_RESPONSE_MODEL:-}" ]]
          [[ "${PROFILE_RESPONSE_MODEL:-}" =~ ^gpt-6-luna$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DEFAULT_BRANCH" = "$(git check-ref-format --branch "$DEFAULT_BRANCH")"
          base_ref_admitted_via=default-branch
          [ "$EXPECTED_BASE_REF" = "$DEFAULT_BRANCH" ] \
            || base_ref_admitted_via=configured-allowlist
          # EXECUTES-FROM-THE-PROTECTED-BASE. Asserted on BOTH lanes, because a
          # comment posted from a pull-request-controlled workflow file would be
          # forgeable evidence whatever verdict it carried.
          #
          if [ "$base_ref_admitted_via" = "default-branch" ]; then
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"
          test "$GITHUB_WORKFLOW_REF" = \
            "${GITHUB_REPOSITORY}/.github/workflows/claude-pr-review.yml@refs/heads/${EXPECTED_BASE_REF}"
          else
          test "$GITHUB_WORKFLOW_REF" = \
            "${GITHUB_REPOSITORY}/.github/workflows/claude-pr-review.yml@refs/heads/${DEFAULT_BRANCH}"
          default_head_live="$(timeout --kill-after=5s 20s gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
            --jq '.object.sha')"
          [[ "$default_head_live" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$default_head_live"
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [ "$publish_verdict" = "PASS" ]; then
          [[ "$EXPECTED_CHUNK_COUNT" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_CHUNK_COUNT" -le 72
          [[ "$EXPECTED_CHUNK_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_COMPACTION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_DIFF_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MERGE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_REPRESENTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RESPONSE_MANIFEST_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          test "${#EXPECTED_RESPONSE_MANIFEST_B64}" -le 60000
          [[ "$EXPECTED_RESPONSE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(printf '%s' "$EXPECTED_RESPONSE_MANIFEST_B64" \
            | base64 -d | sha256sum | cut -d' ' -f1)" \
            = "$EXPECTED_RESPONSE_MANIFEST_SHA256"

          response_manifest="$RUNNER_TEMP/verified-response-manifest.json"
          transcript_gzip="$RUNNER_TEMP/verified-review-transcript.gz"
          transcript="$RUNNER_TEMP/verified-review-transcript.txt"
          ledger="$RUNNER_TEMP/verified-interface-ledger.json"
          printf '%s' "$EXPECTED_RESPONSE_MANIFEST_B64" \
            | base64 -d > "$response_manifest"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --argjson chunk_count "$EXPECTED_CHUNK_COUNT" \
            --arg chunk_manifest_sha256 "$EXPECTED_CHUNK_MANIFEST_SHA256" \
            --arg compaction_manifest_sha256 \
              "$EXPECTED_COMPACTION_MANIFEST_SHA256" \
            --arg exact_diff_sha256 "$EXPECTED_DIFF_SHA256" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg merge_tree_sha "$EXPECTED_MERGE_TREE_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg review_representation_sha256 \
              "$EXPECTED_REPRESENTATION_SHA256" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" '
            . as $response
            | .review.repository == $repository
            and .review.pull_request == $pull_request
            and .review.base_ref == $base_ref
            and .review.base_sha == $base_sha
            and .review.chunk_count == $chunk_count
            and .review.chunk_manifest_sha256 == $chunk_manifest_sha256
            and .review.compaction_manifest_sha256
              == $compaction_manifest_sha256
            and .review.exact_diff_sha256 == $exact_diff_sha256
            and .review.head_sha == $head_sha
            and .review.merge_tree_sha == $merge_tree_sha
            and .review.model == $model
            and .review.review_representation_sha256
              == $review_representation_sha256
            and .review.workflow_sha256 == $workflow_sha256
            and .review.completion_tokens_total <= 4718592
            and (
              .review.review_transcript_bytes
              | type == "number" and . >= 1 and . <= 80000
            )
            and (.review.review_transcript_sha256 | test("^[0-9a-f]{64}$"))
            and (
              .review.interface_ledger_bytes
              | type == "number" and . >= 1 and . <= 10400
            )
            and (
              .review.chunk_summaries_bytes
              | type == "number" and . >= 1 and . <= 21000
            )
            and (.review.chunk_summaries_sha256 | test("^[0-9a-f]{64}$"))
            and (
              .review.interface_fact_count
              | type == "number" and . >= 0 and . <= 32 and floor == .
            )
            and (.review.partial_coverage | type == "boolean")
            and (
              .review.partial_coverage_chunks
              | type == "number" and . >= 0 and . <= 72 and floor == .
            )
            and (
              .review.partial_coverage
              == (.review.partial_coverage_chunks > 0)
            )
            and (
              .review.security_rereviews
              | type == "number" and . >= 0 and . <= 72 and floor == .
            )
            and .review.unresolved_security_partial_chunks == 0
            # RE-DERIVED, not only trusted: every per-chunk stamp must be false,
            # there is one stamp per chunk, and the outcomes add up.
            and (.review.chunk_security_partial | length) == .review.chunk_count
            and all(.review.chunk_security_partial[]; . == false)
            # Where the full chunk records are present, re-derive from them too.
            and all(.review.chunk_reviews[]?; .security_partial == false)
            and (
              .review.security_rereviews_failed
              | type == "number" and . >= 0 and . <= 72 and floor == .
            )
            and (
              .review.security_rereviews_cleared
              | type == "number" and . >= 0 and . <= 72 and floor == .
            )
            and (
              .review.security_rereviews_cleared
              + .review.security_rereviews_failed
              + .review.unresolved_security_partial_chunks
              == .review.security_rereviews
            )
            # A published PASS carries only RESOLVED context re-reviews: every one
            # cleared, none failed (that is a merit failure) or unresolved (no verdict).
            and all(.review | .context_rereviews, .context_rereviews_cleared,
                    .context_rereviews_failed, .context_rereviews_unresolved,
                    .context_rereviews_security, .context_paths_refused, .context_files;
