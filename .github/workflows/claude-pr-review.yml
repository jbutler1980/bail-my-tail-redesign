            if encoded(header) != encoded({key: review[key] for key in keys}):
              raise ValueError("adjudication transcript header binding")
            if lines[-1] != "" or len(lines) != 2 * review["chunk_count"] + 2:
              raise ValueError("adjudication transcript framing or coverage")
            effective = {}
            for offset in range(1, len(lines) - 1, 2):
              frame = re.fullmatch(r"C=([0-9]{4}) T=[0-9]+", lines[offset])
              if not frame:
                raise ValueError("adjudication transcript framing or coverage")
              index = int(frame[1])
              if index in effective or index != len(effective) + 1:
                raise ValueError("adjudication transcript identity or coverage")
              body = json.loads(lines[offset + 1], object_pairs_hook=unique_object)
              if (not isinstance(body, dict) or type(body.get("chunk_index")) is not int
                  or body["chunk_index"] != index):
                raise ValueError("adjudication transcript body identity")
              effective[index] = body
            return effective


          def attest(index, body, files):
            """A CONSISTENCY HASH, not an independent proof: it binds the transcript body and the context
              file list to the review job's own claim that the re-review was supported. Downstream can
              check the binding; it does not prove the support, which only the review job could judge."""
            return {"supported": True, "sha256": digest(encoded(
              {"chunk_index": index, "body": body, "files": files, "supported": True}))}


          def published_evidence(bundle, index, body):
            """A tree-backed body may publish only quotes already in the PR diff, or a 16 byte prefix + hash."""
            allowed = bundle["representation"] + disclosed_context(bundle, index)
            for fact in body.get("interface_facts", []):
              quote = fact.get("evidence")
              if not isinstance(quote, str) or not (quote in allowed or re.fullmatch(r".{16}~sha256:[0-9a-f]{16}", quote, re.S)):
                raise ValueError("tree-sourced evidence is published unredacted")


          def check_files(files):
            if (not isinstance(files, list) or not 0 < len(files) <= MAX_TREE_FILES
                or len({f.get("path") for f in files if isinstance(f, dict)}) != len(files)):
              raise ValueError("tree context file list")
            for f in files:
              if (not isinstance(f, dict) or set(f) != {"path", "tree", "blob", "sha256", "bytes"}
                  or path_refusal(f["path"]) or f["tree"] not in ("candidate", "base")
                  or not isinstance(f["blob"], str) or not re.fullmatch(r"[0-9a-f]{40}", f["blob"])
                  or not isinstance(f["sha256"], str) or not re.fullmatch(r"[0-9a-f]{64}", f["sha256"])
                  or type(f["bytes"]) is not int or not 0 < f["bytes"] <= MAX_TREE_FILE):
                raise ValueError("tree context file entry")


          def verify(response):
            review = response["review"]
            receipt = review["context_adjudication"]
            records = receipt["records"]
            uses = receipt.get("uses", [])
            if (type(review["chunk_count"]) is not int or not 1 <= review["chunk_count"] <= 72
                or not isinstance(records, list) or not isinstance(uses, list)
                or len(records) + len(uses) > review["chunk_count"]):
              raise ValueError("adjudication record shape")
            if review.get("context_rereviews") != len(records) + len(uses):
              raise ValueError("adjudication counter binding")
            if not records and not uses:
              if receipt["source_gzip_b64"] != "":
                raise ValueError("unexpected adjudication source")
            if records or uses:
              compressed = decoded(receipt["source_gzip_b64"], MAX_COMPRESSED)
              # Bound decompression before allocation, including JSON structural overhead.
              with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
                raw = stream.read(2 * MAX_SOURCE + 131073)
                if len(raw) > 2 * MAX_SOURCE + 131072 or stream.read(1):
                  raise ValueError("adjudication decompressed capacity")
              bundle = json.loads(raw)
              source_parts(bundle, review)
            compressed_transcript = decoded(response["review_transcript_gzip_b64"], MAX_COMPRESSED)
            with gzip.GzipFile(fileobj=io.BytesIO(compressed_transcript)) as stream:
              transcript = stream.read(80001)
            if len(transcript) > 80000 or digest(transcript) != review["review_transcript_sha256"]:
              raise ValueError("adjudication effective transcript binding")
            effective = effective_chunks(transcript, review)
            fp = review.get("primary_fingerprints", [])
            check_primary_fingerprints(fp, review)
            if fp:
              requests = review.get("primary_fingerprint_requests")
              if (not isinstance(requests, list) or not 1 <= len(requests) <= 128
                  or len(encoded(requests)) > 32768):
                raise ValueError("fingerprint request receipt missing or oversized")
              for request in requests:
                if (not isinstance(request, dict) or set(request) != {"chunk_index","chunk_nonce","wire_sha256","http_status"}
                    or type(request["chunk_index"]) is not int or not 1 <= request["chunk_index"] <= review["chunk_count"]
                    or not re.fullmatch(r"[0-9a-f]{32}", request["chunk_nonce"])
                    or not re.fullmatch(r"[0-9a-f]{64}", request["wire_sha256"])
                    or not re.fullmatch(r"(?:[1-5][0-9]{2}|transport-error)", request["http_status"])):
                  raise ValueError("fingerprint request receipt invalid")
              for index in fp[0]["affected_chunks"]:
                body = effective.get(index, {})
                if not any(r["chunk_index"] == index and r["chunk_nonce"] == body.get("chunk_nonce")
                    and r["http_status"] == "200" for r in requests):
                  raise ValueError("fingerprint request replay or substitution")
            seen = set()
            for use in uses:
              index = use.get("chunk_index") if isinstance(use, dict) else None
              if (type(index) is not int or index in seen or not 1 <= index <= review["chunk_count"]
                  or set(use) != {"chunk_index", "phase", "files", "refused", "bytes", "attestation"}
                  or use["phase"] != "security" or type(use["bytes"]) is not int or not 0 < use["bytes"] <= 16000
                  or not isinstance(use["refused"], list)):
                raise ValueError("adjudication duplicate identity")
              seen.add(index)
              check_files(use["files"])
              if use["attestation"] != attest(index, effective.get(index), use["files"]):
                raise ValueError("adjudication attestation")
              published_evidence(bundle, index, effective[index])
            for record in records:
              index = record["chunk_index"]
              if type(index) is not int or index in seen:
                raise ValueError("adjudication duplicate identity")
              seen.add(index)
              primary, secondary, tree = record["primary"], record["secondary"], record.get("tree")
              text, original = capsule(bundle, index, primary)
              if tree is not None:
                # Tree files are never published: only the runner, which read them, judged
                # support; here the metadata, the diff binding and the transcript are checked.
                if set(tree) != {"files"}:
                  raise ValueError("tree context record")
                check_files(tree["files"])
                if record.get("attestation") != attest(index, secondary, tree["files"]):
                  raise ValueError("adjudication attestation")
                published_evidence(bundle, index, secondary)
              elif record["context_sha256"] != record["diff_sha256"]:
                raise ValueError("adjudication context binding")
              if (primary["chunk_index"] != index or secondary["chunk_index"] != index
                  or digest(text.encode()) != record["diff_sha256"]
                  or (tree is None and not supported(
                    primary, secondary, text, original + disclosed_context(bundle, index) + record["initial_context"]))
                  or encoded(secondary) != encoded(effective.get(index))):
                raise ValueError("unsupported missing-context dismissal")


          if __name__ == "__main__":
              verify(json.loads(Path(sys.argv[1]).read_text()))
          PY
          # END PROTECTED CONTEXT ADJUDICATION HELPER
          jq -jr .review_transcript_gzip_b64 "$response_manifest" \
            | base64 -d > "$transcript_gzip"
          test "$(wc -c < "$transcript_gzip")" \
            = "$(jq -er .review_transcript_gzip_bytes "$response_manifest")"
          test "$(sha256sum "$transcript_gzip" | cut -d' ' -f1)" \
            = "$(jq -er .review_transcript_gzip_sha256 "$response_manifest")"
          gzip -cd "$transcript_gzip" | head -c 80001 > "$transcript"
          test "$(wc -c < "$transcript")" \
            = "$(jq -er .review.review_transcript_bytes "$response_manifest")"
          test "$(sha256sum "$transcript" | cut -d' ' -f1)" \
            = "$(jq -er .review.review_transcript_sha256 "$response_manifest")"
          jq -jr .interface_ledger "$response_manifest" > "$ledger"
          test "$(wc -c < "$ledger")" \
            = "$(jq -er .review.interface_ledger_bytes "$response_manifest")"
          test "$(sha256sum "$ledger" | cut -d' ' -f1)" \
            = "$(jq -er .review.interface_ledger_sha256 "$response_manifest")"


          # Advisory coverage accounting rides in the evidence beside the flag.
          # Both values were already range-checked by the revalidation above;
          # the digit test here only keeps a malformed value out of --argjson.
          partial_coverage_chunks="$(jq -r '
            .review.partial_coverage_chunks | select(type == "number") | tostring
          ' "$response_manifest")"
          security_rereviews="$(jq -r '
            .review.security_rereviews | select(type == "number") | tostring
          ' "$response_manifest")"
          security_rereviews_cleared="$(jq -r '
            .review.security_rereviews_cleared | select(type == "number") | tostring
          ' "$response_manifest")"
          security_rereviews_failed="$(jq -r '
            .review.security_rereviews_failed | select(type == "number") | tostring
          ' "$response_manifest")"
          security_rereviews_unresolved="$(jq -r '
            .review.unresolved_security_partial_chunks | select(type == "number") | tostring
          ' "$response_manifest")"
          context_rereviews="$(jq -r '
            .review.context_rereviews | select(type == "number") | tostring
          ' "$response_manifest")"
          context_files="$(jq -r '
            .review.context_files | select(type == "number") | tostring
          ' "$response_manifest")"
          [[ "$context_rereviews" =~ ^[0-9]{1,3}$ ]]
          [[ "$context_files" =~ ^[0-9]{1,3}$ ]]
          [[ "$security_rereviews_cleared" =~ ^[0-9]{1,2}$ ]]
          [[ "$security_rereviews_failed" =~ ^[0-9]{1,2}$ ]]
          [[ "$security_rereviews_unresolved" =~ ^[0-9]{1,2}$ ]]
          [[ "$partial_coverage_chunks" =~ ^[0-9]{1,2}$ ]]
          [[ "$security_rereviews" =~ ^[0-9]{1,2}$ ]]

          # Read from the manifest whose digest this job has already verified,
          # so the published flag cannot disagree with the reviewed evidence.
          #
          #
          #
          partial_coverage="$(jq -r '
            .review.partial_coverage | select(type == "boolean") | tostring
          ' "$response_manifest")"
          case "$partial_coverage" in
            true|false) ;;
            *)
              printf 'Adversarial review publication failed assertion: review.partial_coverage is not a boolean (partial_coverage_bytes=%s)\n' \
                "${#partial_coverage}" >&2
              exit 1
              ;;
          esac
          evidence="$(jq -cn \
            --argjson partial_coverage "$partial_coverage" \
            --argjson partial_coverage_chunks "$partial_coverage_chunks" \
            --argjson security_rereviews "$security_rereviews" \
            --argjson security_rereviews_cleared "$security_rereviews_cleared" \
            --argjson security_rereviews_failed "$security_rereviews_failed" \
            --argjson security_rereviews_unresolved "$security_rereviews_unresolved" \
            --argjson context_rereviews "$context_rereviews" \
            --argjson context_files "$context_files" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --argjson chunk_count "$EXPECTED_CHUNK_COUNT" \
            --arg chunk_manifest_sha256 "$EXPECTED_CHUNK_MANIFEST_SHA256" \
            --arg compaction_manifest_sha256 "$EXPECTED_COMPACTION_MANIFEST_SHA256" \
            --arg exact_diff_sha256 "$EXPECTED_DIFF_SHA256" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg merge_tree_sha "$EXPECTED_MERGE_TREE_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg review_representation_sha256 "$EXPECTED_REPRESENTATION_SHA256" \
            --arg response_manifest_b64 "$EXPECTED_RESPONSE_MANIFEST_B64" \
            --arg response_manifest_sha256 "$EXPECTED_RESPONSE_MANIFEST_SHA256" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              repository: $repository,
              pull_request: $pull_request,
              base_ref: $base_ref,
              base_sha: $base_sha,
              chunk_count: $chunk_count,
              chunk_manifest_sha256: $chunk_manifest_sha256,
              compaction_manifest_sha256: $compaction_manifest_sha256,
              exact_diff_sha256: $exact_diff_sha256,
              head_sha: $head_sha,
              merge_tree_sha: $merge_tree_sha,
              model: $model,
              review_representation_sha256: $review_representation_sha256,
              response_manifest_b64: $response_manifest_b64,
              response_manifest_sha256: $response_manifest_sha256,
              review_protocol: "bounded-diff-chunks-v1",
              workflow_sha256: $workflow_sha256,
              workflow_path: ".github/workflows/claude-pr-review.yml",
              run_id: $run_id,
              run_attempt: $run_attempt,
              verdict: "PASS",
              partial_coverage: $partial_coverage,
              partial_coverage_chunks: $partial_coverage_chunks,
              security_rereviews: $security_rereviews,
              security_rereview_outcomes: {
                cleared: $security_rereviews_cleared,
                unresolved: $security_rereviews_unresolved,
                failed: $security_rereviews_failed
              },
              context_rereviews: $context_rereviews,
              context_rereview_outcomes: {
                cleared: $context_rereviews,
                unresolved: 0,
                failed: 0
              },
              context_files: $context_files,
              merge_authority: "none"
            }
          ')"
          visible_body=""
          else
          # --- FAIL LANE ------------------------------------------------------
          #
          #
          [[ "$OBJECTION_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          test "${#OBJECTION_B64}" -le 60000
          decoded_objection_file="$RUNNER_TEMP/published-objection.decoded"
          objection_file="$RUNNER_TEMP/published-objection.txt"
          printf '%s' "$OBJECTION_B64" | base64 -d > "$decoded_objection_file"
          tr -cd '\11\12\40-\176' \
            < "$decoded_objection_file" > "$objection_file"
          test -s "$objection_file"
          objection="$(cat "$objection_file")"
          # THE HIDDEN COMMENT IS AN HTML COMMENT, AND `-->` ENDS ONE.
          #
          #
          #
          # NOTE: a comment line here must never BEGIN with the linter's name --
          # that is how it spells a directive, and an English sentence in that
          # position is parsed as one and fails the run (SC1072/SC1073).
          published_objection_b64="$(base64 -w0 "$objection_file")"
          evidence="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --arg failure_stage "$FAILURE_STAGE" \
            --arg objection_b64 "$published_objection_b64" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              repository: $repository,
              pull_request: $pull_request,
              base_ref: $base_ref,
              base_sha: $base_sha,
              head_sha: $head_sha,
              model: $model,
              review_protocol: "bounded-diff-chunks-v1",
              workflow_sha256: $workflow_sha256,
              workflow_path: ".github/workflows/claude-pr-review.yml",
              run_id: $run_id,
              run_attempt: $run_attempt,
              verdict: "FAIL",
              failure_stage: $failure_stage,
              objection_b64: $objection_b64,
              merge_authority: "none"
            }
          ')"
          # step summary and the published comment escape differently.
          markdown_fence() {
            local file="$1"
            local longest
            longest="$(awk '{
              run = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "`") {
                  run++
                  if (run > max) max = run
                } else {
                  run = 0
                }
              }
            } END { print max + 0 }' "$file")"
            [ -n "$longest" ] || longest=0
            local width=3
            if [ "$longest" -ge 3 ]; then
              width=$((longest + 1))
            fi
            printf '%*s' "$width" '' | tr ' ' '`'
          }

          objection_fence="$(markdown_fence "$objection_file")"
          #
          visible_body="$(printf '%s\n\n%s\n%s\n\n%s\n%s\n%s\n\n' \
            '### Adversarial review: FAIL' \
            'The reviewer read this change and objected. This comment is **advisory** and confers **no merge authority**; it is evidence, not a decision.' \
            "Reviewed head \`${EXPECTED_HEAD_SHA}\` against base \`${EXPECTED_BASE_REF}\`, model \`${EXPECTED_MODEL}\`, [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            "$objection_fence" \
            "$objection" \
            "$objection_fence")"
          fi
          bdir="$RUNNER_TEMP/review-evidence-bundle"
          install -d -m 0700 "$bdir"
          printf '%s\n' "$evidence" > "$bdir/bundle.json"
          pending_evidence="$(jq -c '.verdict = "PENDING"' <<<"$evidence")"
          pending_body="<!-- claude-review-evidence:v3 ${pending_evidence} -->"
          # The name is kept deliberately. scripts/fleet-autonomy.sh pins the
          #
          # `visible_body` is built with a command substitution, and those STRIP
          #
          # Added only when there IS a visible body, so the PASS comment stays
          # byte-for-byte what it has always been.
          visible_separator=""
          [ -z "$visible_body" ] || visible_separator=$'\n\n'
          pass_body="${visible_body}${visible_separator}<!-- claude-review-evidence:v3 ${evidence} -->"
          test "$(printf '%s' "$pending_body" | wc -c)" -le 65536
          test "$(printf '%s' "$pass_body" | wc -c)" -le 65536
          # THE COMMENT BOUNDARY IS ASSERTED, NOT ASSUMED.
          #
          for boundary_checked in "$pending_evidence" "$evidence"; do
            case "$boundary_checked" in
              *'-->'*)
                echo "Adversarial review publication failed assertion: evidence JSON contains an HTML comment terminator" >&2
                exit 1
                ;;
            esac
          done

          bounded_gh() {
            timeout --kill-after=5s 20s gh api "$@"
          }

          validate_live_controls() {
            local phase="$1"
            local pr_file="$RUNNER_TEMP/${phase}-pull-request.json"
            local ref_file="$RUNNER_TEMP/${phase}-protected-ref.json"
            local run_file="$RUNNER_TEMP/${phase}-workflow-run.json"
            local state head_ref
            bounded_gh "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              > "$pr_file" || return 1
            # As in the source step: the pull request object's base.sha is the
            # frozen event value, never the live default branch head, so the
            # base is bound on the protected ref immediately below instead.
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg base_ref "$EXPECTED_BASE_REF" \
              --arg head "$EXPECTED_HEAD_SHA" \
              --arg base_ref_admitted "$base_ref_admitted_via" '
              .state == "open"
              and .draft == false
              and .base.ref == $base_ref
              and ( .base.ref == .base.repo.default_branch
                    or $base_ref_admitted == "configured-allowlist" )
              and .head.repo.full_name == $repository
              and .head.sha == $head
              and all(.labels[]; .name != "do-not-merge")
            ' "$pr_file" >/dev/null || return 1
            # Taken from the pull request object the gate above just bound to
            # this exact repository, base, and head.
            head_ref="$(jq -er .head.ref "$pr_file")" || return 1
            test -n "$head_ref" || return 1
            bounded_gh \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${EXPECTED_BASE_REF}" \
              > "$ref_file" || return 1
            jq -e \
              --arg ref "refs/heads/${EXPECTED_BASE_REF}" \
              --arg base "$EXPECTED_BASE_SHA" '
              .ref == $ref
              and .object.type == "commit"
              and .object.sha == $base
            ' "$ref_file" >/dev/null || return 1
            if [ "$base_ref_admitted_via" = "configured-allowlist" ]; then
              local live_default_head
              live_default_head="$(bounded_gh \
                "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
                --jq '.object.sha')" || return 1
              [[ "$live_default_head" =~ ^[0-9a-f]{40}$ ]] || return 1
              test "$GITHUB_WORKFLOW_SHA" = "$live_default_head" || return 1
            fi
            bounded_gh "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > "$run_file" || return 1
            jq -e \
              --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg head_ref "$head_ref" \
              --arg head "$EXPECTED_HEAD_SHA" '
              .id == $run_id
              and .run_attempt == $run_attempt
              and .event == "pull_request_target"
              and .head_branch == $head_ref
              and .head_sha == $head
              and .path == ".github/workflows/claude-pr-review.yml"
              and .status == "in_progress"
              and .conclusion == null
            ' "$run_file" >/dev/null || return 1
            state="$(curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --max-redirs 2 \
              --max-time 15 --retry 2 --retry-max-time 60 \
              https://raw.githubusercontent.com/jbutler1980/agent-ops-flags/main/state \
              | tr -d '[:space:]')" || return 1
            test "$state" = "on" || return 1
          }

          fetch_comment() {
            local output="$1"
            bounded_gh \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              > "$output"
            test "$(wc -c < "$output")" -le 131072
          }

          validate_comment() {
            local input="$1"
            local expected_body="$2"
            jq -e \
              --argjson id "$comment_id" \
              --arg body "$expected_body" '
              .id == $id and .body == $body
            ' "$input" >/dev/null
          }

          patch_comment() {
            local body="$1"
            local output="$2"
            bounded_gh -X PATCH \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" > "$output" \
              && test "$(wc -c < "$output")" -le 131072 \
              && validate_comment "$output" "$body"
          }

          restore_pending() {
            local recovery="$RUNNER_TEMP/restore-pending.json"
            for _ in 1 2 3; do
              if patch_comment "$pending_body" "$recovery"; then
                return 0
              fi
              if fetch_comment "$recovery" \
                && validate_comment "$recovery" "$pending_body"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          validate_live_controls pre
          created="$RUNNER_TEMP/pending-comment.json"
          bounded_gh -X POST \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$pending_body" > "$created"
          test "$(wc -c < "$created")" -le 131072
          comment_id="$(jq -er .id "$created")"
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          validate_comment "$created" "$pending_body"

          validate_live_controls publish
          pass_response="$RUNNER_TEMP/pass-comment.json"
          if ! patch_comment "$pass_body" "$pass_response"; then
            recovered="$RUNNER_TEMP/pass-recovery.json"
            fetch_comment "$recovered"
            if validate_comment "$recovered" "$pending_body"; then
              exit 1
            fi
            validate_comment "$recovered" "$pass_body"
          fi

          final_comment="$RUNNER_TEMP/final-comment.json"
          final_liveness_status=0
          validate_live_controls final || final_liveness_status=$?
          if [ "$final_liveness_status" -eq 0 ] \
            && fetch_comment "$final_comment" \
            && validate_comment "$final_comment" "$pass_body"; then
            exit 0
          fi

          echo "Post-publication validation failed; compensating PASS evidence." >&2
          if restore_pending; then
            exit 1
          fi
          for _ in 1 2 3; do
            if bounded_gh -X DELETE \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"; then
              exit 1
            fi
            sleep 1
          done
          echo "Unable to confirm compensation or deletion of published PASS evidence." >&2
          exit 1

      - name: Upload evidence bundle
